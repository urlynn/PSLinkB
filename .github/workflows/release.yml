      - name: Verify luci IPK
        run: |
          set -e
          for variant in uhttpd nginx; do
            LUCI=$(ls /tmp/pkgs/luci-app-pslinkb-*-${variant}.ipk 2>/dev/null | head -1)
            [ -z "$LUCI" ] && echo "ERROR: no luci IPK found for $variant" && exit 1
            sudo cp "$LUCI" /tmp/openwrt-ipk-root/tmp/luci.ipk
            sudo chroot /tmp/openwrt-ipk-root /bin/opkg install --force-reinstall /tmp/luci.ipk && echo "luci IPK OK ($variant)"
          done
      - name: Verify IPK - umount
        run: sudo umount /tmp/openwrt-ipk-root/dev
  release:
    needs: [package-x86_64-linux, package-aarch64-linux, package-openwrt, verify-openwrt-x86_64, verify-openwrt-aarch64, package-windows, package-macos-aarch64, package-macos-x86_64]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'pkgs-*'
          path: /tmp/pkg
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${V#v}"
          echo "=== All ===" && ls -la /tmp/pkg/ && echo "Count: $(ls /tmp/pkg/ | wc -l)"
          shopt -s nullglob; FILES=( /tmp/pkg/* )
          # 上传 aarch64 tar.gz (install.sh 下载), 排除 x86_64 tar.gz (用 apk/ipk)
          UPLOAD=()
          for f in "${FILES[@]}"; do
            [[ "$f" != *-openwrt-x86_64.tar.gz ]] && UPLOAD+=("$f")
          done
          if [ ${#UPLOAD[@]} -gt 0 ]; then
            if gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null; then
              gh release upload "$TAG" "${UPLOAD[@]}" --repo ${{ github.repository }} --clobber
            else
              gh release create "$TAG" "${UPLOAD[@]}" --repo ${{ github.repository }} --title "$TAG"
            fi
          else
            echo "No new artifacts to upload."
          fi
