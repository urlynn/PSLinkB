<%+header%>
<h2 name="title"><%:PSLinkB%></h2>
<script>(function(){var t=document.querySelector('h2[name="title"]');var m=document.getElementById('tabmenu');if(t&&m&&m.parentNode){m.parentNode.insertBefore(t,m)}})();</script>

<style>
.pslinkb-auth {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
}

.pslinkb-auth .ps-card {
    padding: 24px !important;
    margin: 0 !important;
    border: 0 !important;
    text-align: center;
}

.pslinkb-auth .ps-card h2 {
    font-size: 15px;
    margin: 0 0 8px 0;
}

.pslinkb-auth .ps-card p {
    font-size: 13px;
    margin: 0;
    opacity: 0.6;
}
</style>

<div class="pslinkb-auth">
  <div class="cbi-section ps-card">
    <h2><%:No Active Verification%></h2>
    <p><%:No face or QR verification is currently required.%></p>
    <p style="margin-top:12px"><%:Redirecting to status page...%></p>
  </div>
</div>

<script>
setTimeout(function(){location.href='<%=luci.dispatcher.build_url("admin/services/pslinkb/status")%>'},3000);
</script>

<%+footer%>
