<%+header%>
<h2 name="title"><%:PSLinkB%></h2>
<script>(function(){var t=document.querySelector('h2[name="title"]');var m=document.getElementById('tabmenu');if(t&&m&&m.parentNode){m.parentNode.insertBefore(t,m)}})();</script>

<style>
.pslinkb {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  box-sizing: border-box;
}
.pslinkb *,
.pslinkb *::before,
.pslinkb *::after { box-sizing: border-box; }

.pslinkb .ps-card {
  padding: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  overflow: hidden;
}

.pslinkb .card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(128,128,128,0.12);
}

.pslinkb .card-title {
  font-size: 14px;
  font-weight: 600;
}

.pslinkb .card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  opacity: 0.6;
  flex-shrink: 0;
}

.pslinkb .icon-btn {
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid rgba(128,128,128,0.2);
  border-radius: 0.25rem;
  background: rgba(128,128,128,0.06);
  cursor: pointer;
  padding: 0;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.pslinkb .icon-btn:hover {
  background: rgba(128,128,128,0.14);
  border-color: rgba(128,128,128,0.35);
}
.pslinkb .icon-btn:active { transform: scale(0.92); }
.pslinkb .icon-btn svg { width: 15px; height: 15px; }

.pslinkb .live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #22c55e;
  flex-shrink: 0;
  animation: pslinkb-pulse 2s ease-in-out infinite;
}
@keyframes pslinkb-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.pslinkb pre {
  padding: 12px 14px;
  margin: 0;
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  font-size: 12px;
  line-height: 1.5;
  font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
  tab-size: 2;
}

@media (max-width: 640px) {
  .pslinkb { gap: 8px; }
  .pslinkb .card-head { padding: 8px 10px; flex-wrap: wrap; }
  .pslinkb pre {
    padding: 8px 10px;
    font-size: 11px;
    max-height: calc(100vh - 200px);
  }
}
</style>

<script>
function post(u){var f=document.createElement('form');f.method='POST';f.action=u;var t=document.createElement('input');t.type='hidden';t.name='token';t.value='<%=token%>';f.appendChild(t);document.body.appendChild(f);f.submit()}
</script>

<div class="pslinkb">
  <div class="cbi-section ps-card">
    <div class="card-head">
      <span class="card-title"><%:Log%></span>
      <span class="card-meta">
        <span class="live-dot"></span>
        <span><%:Auto refresh%></span>
        <button class="icon-btn" title="<%:Clear Log%>" onclick="post('<%=luci.dispatcher.build_url("admin/services/pslinkb/ctl_clear_log")%>')">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6v14H5V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </span>
    </div>
    <pre id="logContent"><%=luci.sys.exec("cat /tmp/pslinkb/log 2>/dev/null | tail -80")%></pre>
  </div>
</div>

<script>
// Source: luci.js — LuCI.request.poll.add() / LuCI.poll singleton.
(function() {
  var el = document.getElementById('logContent');
  if (!el) return;

  var url = '<%=luci.dispatcher.build_url("admin/services/pslinkb/log-text")%>';

  L.Request.poll.add(1, url, {}, function(res) {
    if (res && res.ok)
      el.textContent = res.text();
  });
})();
</script>

<%+footer%>
